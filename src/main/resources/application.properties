spring.application.name=lacasita
spring.application.version=1.0
server.port=8443
server.address=0.0.0.0
server.servlet.context-path=/api/lacasita/rest/v1
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

server.forward-headers-strategy=framework
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jackson.default-property-inclusion=non_null


# CloudFront
aws.cloudfront.domain=${CLOUDFRONT_DOMAIN} 
aws.s3.region=${BUCKET_REGION}
aws.s3.bucket=${BUCKET_NAME}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# JWT
jwt.secret=${JWT_SECRET}
app.redis.enabled=${APP_REDIS_ENABLED:true}

spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000
management.health.redis.enabled=${APP_REDIS_ENABLED:true}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=lacasita


# Rate limiting (por IP de cliente)
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=60
app.rate-limit.refill-period=PT1M
app.rate-limit.key-prefix=lacasita:rate-limit:

# Bloqueo por cuenta
app.account-lockout.enabled=${APP_ACCOUNT_LOCKOUT_ENABLED:true}
app.account-lockout.max-attempts=5
app.account-lockout.lockout-duration=PT15M
app.account-lockout.key-prefix=lacasita:account-lock:

# Web Push (notificaciones del sistema, con la app cerrada)
webpush.vapid.public-key=${VAPID_PUBLIC_KEY:}
webpush.vapid.private-key=${VAPID_PRIVATE_KEY:}
webpush.vapid.subject=${VAPID_SUBJECT:mailto:soporte@mail.lacasitarest.com}


resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:La Casita Restaurant & Garden <no-reply@mail.lacasitarest.com>}
app.mail.restaurant-name=${MAIL_RESTAURANT_NAME:La Casita Restaurant & Garden}

# Web pública (LaCasitaAppWeb), para armar el link de una cotización compartida
app.public-site.base-url=${PUBLIC_SITE_BASE_URL:https://lacasitarest.com}

# CORS: lista separada por comas de origenes permitidos
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8100}